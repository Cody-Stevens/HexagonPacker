<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexagon Packer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen flex flex-col md:flex-row">

    <!-- ==========================================
         SIDEBAR / CONTROLS
         ========================================== -->
    <div class="w-full md:w-80 bg-slate-800 p-6 flex flex-col gap-6 shadow-xl z-10 border-r border-slate-700 overflow-y-auto shrink-0">
        
        <!-- Header -->
        <div>
            <h1 class="text-2xl font-bold text-teal-400 mb-1">Hexagon Packer</h1>
            <p class="text-xs text-slate-500">Experimental Multi-Shape Mode</p>
        </div>

        <!-- Controls -->
        <div class="space-y-4">
            
            <!-- Units -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Units</label>
                <select id="unitSelect" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 focus:outline-none focus:border-teal-500 text-sm">
                    <option value="px">Pixels (px)</option>
                    <option value="mm">Millimeters (mm)</option>
                    <option value="cm">Centimeters (cm)</option>
                    <option value="in">Inches (in)</option>
                </select>
            </div>

            <!-- Parent Shape -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Parent Shape</label>
                <select id="parentShape" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 focus:outline-none focus:border-teal-500 text-sm">
                    <optgroup label="Regular Polygons">
                        <option value="triangle">Triangle (3)</option>
                        <option value="square">Square (4)</option>
                        <option value="pentagon">Pentagon (5)</option>
                        <option value="hexagon" selected>Hexagon (6)</option>
                        <option value="heptagon">Heptagon (7)</option>
                        <option value="octagon">Octagon (8)</option>
                        <option value="nonagon">Nonagon (9)</option>
                        <option value="decagon">Decagon (10)</option>
                        <option value="dodecagon">Dodecagon (12)</option>
                    </optgroup>
                    <optgroup label="Curves">
                        <option value="circle">Circle</option>
                        <option value="ellipse">Ellipse (2:1)</option>
                    </optgroup>
                    <optgroup label="Stars">
                        <option value="star5">5-Point Star</option>
                        <option value="star6">6-Point Star</option>
                        <option value="star8">8-Point Star</option>
                    </optgroup>
                    <optgroup label="Exotic">
                        <option value="heart">Heart</option>
                        <option value="cross">Cross</option>
                        <option value="arrow">Arrow</option>
                        <option value="gear">Gear (8-tooth)</option>
                    </optgroup>
                </select>
            </div>

            <!-- Parent Size -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Parent Size (<span class="unit-label">px</span>)</label>
                <input type="number" id="parentSize" value="300" min="1" step="0.1" 
                    class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 focus:outline-none focus:border-teal-500 transition-colors">
            </div>

            <!-- Parent Rotation -->
            <div>
                <div class="flex justify-between items-end mb-1">
                    <label class="block text-sm font-medium text-slate-300">Parent Rotation (°)</label>
                    <input type="number" id="parentRotationVal" value="0" min="0" max="360" step="1"
                        class="inline-value-input">
                </div>
                <input type="range" id="parentRotation" value="0" min="0" max="360" step="0.1" 
                    class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-teal-500">
            </div>

            <!-- Child Orientation -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Child Orientation</label>
                <div class="flex items-center gap-3">
                    <span class="text-xs text-slate-400">Pointy</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="childOrientationToggle" class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-teal-600"></div>
                    </label>
                    <span class="text-xs text-slate-400">Flat</span>
                </div>
            </div>

            <!-- Parent Boundary -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Parent Boundary</label>
                <div class="flex items-center gap-3">
                    <span class="text-xs text-slate-400">Simple</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="boundaryToggle" class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-teal-600"></div>
                    </label>
                    <span class="text-xs text-slate-400">Conform</span>
                </div>
            </div>

            <!-- Axial Alt Mode (Debug) -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Axial Conversion (Debug)</label>
                <div class="flex items-center gap-3">
                    <span class="text-xs text-slate-400">Odd-q/r</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="axialAltToggle" class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-orange-600"></div>
                    </label>
                    <span class="text-xs text-slate-400">Even-q/r</span>
                </div>
            </div>

            <!-- Density -->
            <div>
                <div class="flex justify-between items-end mb-1">
                    <label class="block text-sm font-medium text-slate-300">Density (Scale)</label>
                    <input type="number" id="densityVal" value="5" min="0.1" max="50" step="0.01"
                        class="inline-value-input">
                </div>
                <input type="range" id="density" value="5" min="0.1" max="50" step="0.1" 
                    class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-teal-500">
            </div>

            <!-- Padding -->
            <div>
                <div class="flex justify-between items-end mb-1">
                    <label class="block text-sm font-medium text-slate-300">Padding (<span class="unit-label">px</span>)</label>
                    <input type="number" id="paddingVal" value="2" min="0" max="100" step="0.01"
                        class="inline-value-input">
                </div>
                <input type="range" id="padding" value="2" min="0" max="50" step="0.1" 
                    class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-teal-500">
            </div>

            <!-- Origin Offset -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Origin Offset (<span class="unit-label">px</span>)</label>
                <div class="flex gap-2">
                    <div class="flex-1">
                        <label class="text-xs text-slate-500">X</label>
                        <input type="number" id="originOffsetX" value="0" step="0.1" 
                            class="w-full bg-slate-900 border border-slate-600 rounded px-2 py-1 text-sm focus:outline-none focus:border-teal-500">
                    </div>
                    <div class="flex-1">
                        <label class="text-xs text-slate-500">Y</label>
                        <input type="number" id="originOffsetY" value="0" step="0.1" 
                            class="w-full bg-slate-900 border border-slate-600 rounded px-2 py-1 text-sm focus:outline-none focus:border-teal-500">
                    </div>
                </div>
            </div>
            
        </div>

        <hr class="border-slate-700">

        <!-- Statistics -->
        <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700 space-y-2">
            <h3 class="text-sm font-semibold text-slate-300 border-b border-slate-700 pb-2 mb-2">Statistics</h3>
            
            <div class="flex justify-between">
                <span class="text-xs text-slate-400">Total Count:</span>
                <span id="statCount" class="text-sm font-mono text-white">0</span>
            </div>
            
            <div class="flex justify-between">
                <span class="text-xs text-slate-400">Child Edge:</span>
                <span id="statEdge" class="text-sm font-mono text-white">0.00</span>
            </div>

            <div class="flex justify-between">
                <span class="text-xs text-slate-400">Child Width:</span>
                <span id="statWidth" class="text-sm font-mono text-white">0.00</span>
            </div>
        </div>

        <!-- Export Button -->
        <div class="mt-auto pt-4">
            <button id="downloadBtn" class="w-full bg-teal-600 hover:bg-teal-500 text-white font-semibold py-3 px-4 rounded transition-colors flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
                Export SVG
            </button>
        </div>
    </div>

    <!-- ==========================================
         MAIN RENDERING AREA
         ========================================== -->
    <div class="flex-1 bg-slate-900 relative overflow-hidden flex items-center justify-center p-8" id="canvasContainer">
        <!-- Background Grid Pattern -->
        <div class="absolute inset-0 opacity-10 pointer-events-none canvas-grid-pattern"></div>

        <canvas id="canvas" class="bg-slate-800 rounded shadow-2xl"></canvas>
    </div>

    <!-- Load Application Scripts -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
